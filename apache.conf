# Apache 2.4 equivalent of nginx.conf
#
# Required modules:
#   mod_headers, mod_deflate, mod_mime, mod_autoindex
# Run with:  apache2 -f /path/to/apache.conf -X   (custom standalone config)
# or include this file in your VirtualHost setup.
#
# NOTE: DocumentRoot must be an absolute path in Apache.
#       Adapt APACHE_BASE below to your deployment directory.

Define APACHE_BASE /opt/webvm

# ── Server basics --------------------------------------------
PidFile apache_user.pid
ErrorLog ${APACHE_BASE}/apache_main_error.log
LogLevel info

# ── Server block (nginx: server { ... }) ---------------------
<VirtualHost *:8081>
    ServerName webvm.s2.darknio.ovh

    # (nginx equivalent, commented like in the original file)
    # Listen 8080
    # SSLEngine on
    # SSLCertificateFile    ${APACHE_BASE}/nginx.crt
    # SSLCertificateKeyFile ${APACHE_BASE}/nginx.key

    Listen 8081

    # nginx: charset utf-8;
    AddDefaultCharset utf-8

    # ── MIME types (nginx: types { ... }) --------------------
    AddType text/html                             .html .htm .shtml
    AddType text/css                              .css
    AddType application/javascript                .js
    AddType application/wasm                      .wasm
    AddType image/png                             .png
    AddType image/jpeg                            .jpg .jpeg

    # nginx: default_type application/octet-stream;
    TypesConfig /etc/mime.types
    DefaultType application/octet-stream

    # Access log (nginx: access_log nginx_access.log)
    CustomLog ${APACHE_BASE}/apache_access.log combined
    ErrorLog ${APACHE_BASE}/apache_error.log

    # ── gzip (nginx: gzip on; gzip_types ...) ---------------
    SetOutputFilter DEFLATE
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/wasm
    AddOutputFilterByType DEFLATE text/plain

    # nginx: sendfile on;
    EnableSendfile on

    # ── location / { root build; autoindex on; ... } ---------
    DocumentRoot "${APACHE_BASE}/build"
    <Directory "${APACHE_BASE}/build">
        Options +Indexes +FollowSymLinks
        DirectoryIndex index.html index.htm
        AllowOverride None
        Require all granted

        Header always set 'Cross-Origin-Opener-Policy' 'same-origin'
        Header always set 'Cross-Origin-Embedder-Policy' 'require-corp'
        Header always set 'Cross-Origin-Resource-Policy' 'cross-origin'
    </Directory>

    # ── location /custom-disk-images/ { root .; } ------------
    # In nginx "root ." resolves relative to the server root,
    # i.e. APACHE_BASE/custom-disk-images/
    Alias /custom-disk-images/ "${APACHE_BASE}/custom-disk-images/"
    <Directory "${APACHE_BASE}/custom-disk-images">
        Options +FollowSymLinks
        AllowOverride None
        Require all granted

        Header always set 'Cross-Origin-Opener-Policy' 'same-origin'
        Header always set 'Cross-Origin-Embedder-Policy' 'require-corp'
        Header always set 'Cross-Origin-Resource-Policy' 'cross-origin'
    </Directory>
</VirtualHost>
